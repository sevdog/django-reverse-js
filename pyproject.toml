[build-system]
requires = [
    "setuptools>=60",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "django-reverse-js"
version = "0.1.9"
license = "MIT"
authors = [{name="Davide Setti"}]
dependencies = [
    "django>=4.2",
]
requires-python = ">=3.12"
description = "Django URL handling in JavaScript"
classifiers = [
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Framework :: Django",
	"Framework :: Django :: 4.2",
	"Framework :: Django :: 5.0",
	"Framework :: Django :: 5.1",
	"Framework :: Django :: 5.2",
	"Framework :: Django :: 6.0",
	"Framework :: Django :: 6.1",
    "Operating System :: OS Independent",
	"Intended Audience :: Developers",
]
dynamic = ["readme"]

[project.urls]
"Homepage" = "https://github.com/sevdog/django-reverse-js"
"Bug Tracker" = "https://github.com/sevdog/django-reverse-js/issues"


[tool.setuptools]
packages = [
    "django_reverse_js",
    "django_reverse_js.management",
    "django_reverse_js.management.commands",
    "django_reverse_js.templates",
    "django_reverse_js.templates.django_reverse_js",
    "django_reverse_js.templatetags",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown; charset=UTF-8; variant=GFM"}

[dependency-groups]
tests = [
    "coverage[toml]",
    "pytest",
    "pytest-django",
    "pytest-cov",
]
linters = [
    "django-upgrade",
    "pre-commit",
    "pyupgrade",
    "ruff",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    # do not check for templates
    "*/templates/*",
    # skip statics
    "*/static/*",
    "*/apps.py",
]

branch = true

source = [
    "django_reverse_js",
]

[tool.ruff]
# formatter line-length, matches the default previously used by black
line-length = 88

[tool.ruff.lint]
# pycodestyle (E, W) + pyflakes (F), the rules flake8 enabled by default
select = ["E", "W", "F"]

[tool.ruff.lint.pycodestyle]
# keep the more permissive limit previously set for flake8
max-line-length = 100

[tool.ruff.format]
# equivalent of "black -S": do not normalize string quotes
quote-style = "preserve"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
pythonpath = "."

[tool.tox]
legacy_tox_ini = """
[tox]
min_version = 4.22
envlist =
    py312-django{42,50,51,52,60,61,main}
    py313-django{51,52,60,61,main}
    py314-django{52,60,61,main}
    qa

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    4.2: django42
    5.0: django50
    5.1: django51
    5.2: django52
    6.0: django60
    6.1: django61
    main: djangomain

[testenv]
package = editable
dependency_groups = tests
allowlist_externals = py.test
commands = py.test
deps=
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz


[testenv:qa]
skip_install=true
dependency_groups = linters
commands =
    ruff check django_reverse_js tests
    ruff format --diff django_reverse_js tests
"""